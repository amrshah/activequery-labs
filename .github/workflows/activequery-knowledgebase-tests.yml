name: ActiveQuery knowledgebase browser tests

on:
  push:
    branches: [main]
    paths:
      - "knowledgebase/**"
      - "tests/**"
      - "tools/**"
      - "vendor/**"
      - "package.json"
      - "playwright.config.js"
      - "server.mjs"
      - "rebuild/**"
      - ".github/workflows/activequery-knowledgebase-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "knowledgebase/**"
      - "tests/**"
      - "tools/**"
      - "vendor/**"
      - "package.json"
      - "playwright.config.js"
      - "server.mjs"
      - "rebuild/**"
      - ".github/workflows/activequery-knowledgebase-tests.yml"

jobs:
  browser-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install
      - name: Fetch pinned upstream framework sources
        run: npm run sources:fetch
      - name: Generate AQCSS AST catalog
        run: npm run catalog:aqcss -- vendor/ActiveQuery.css knowledgebase/aqcss/generated-ast-catalog.json
      - name: Generate AQJS AST catalog
        run: npm run catalog:aqjs -- vendor/ActiveQuery.js vendor/ActiveQuery.min.js knowledgebase/aqjs/generated-ast-catalog.json
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Run browser tests
        run: npm test

      - name: Upload generated AQCSS catalog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqcss-postcss-catalog
          path: |
            knowledgebase/aqcss/generated-ast-catalog.json
            knowledgebase/aqjs/generated-ast-catalog.json
          if-no-files-found: ignore
