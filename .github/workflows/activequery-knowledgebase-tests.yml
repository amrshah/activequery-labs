name: ActiveQuery knowledgebase browser tests

on:
  push:
    branches: [main]
    paths:
      - "knowledgebase/**"
      - "tests/**"
      - "tools/**"
      - "vendor/**"
      - "package.json"
      - "playwright.config.js"
      - "server.mjs"
      - ".github/workflows/activequery-knowledgebase-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "knowledgebase/**"
      - "tests/**"
      - "tools/**"
      - "vendor/**"
      - "package.json"
      - "playwright.config.js"
      - "server.mjs"
      - ".github/workflows/activequery-knowledgebase-tests.yml"

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install
      - name: Fetch pinned upstream framework sources
        shell: bash
        run: |
          git clone https://github.com/ActiveQuery/CSS.git /tmp/aqcss
          git -C /tmp/aqcss checkout 6f479f6a3f315d2623af79dd49c84cb379b52473
          git clone https://github.com/ActiveQuery/JS.git /tmp/aqjs
          git -C /tmp/aqjs checkout adb1b19770ca68840dc2f9e62de556a324bee2fa
          mkdir -p vendor
          cp /tmp/aqcss/ActiveQuery.css vendor/ActiveQuery.css
          cp /tmp/aqcss/ActiveQuery.min.css vendor/ActiveQuery.min.css
          cp /tmp/aqjs/ActiveQuery.js vendor/ActiveQuery.js
          cp /tmp/aqjs/ActiveQuery.min.js vendor/ActiveQuery.min.js
          test "$(git -C /tmp/aqcss show HEAD:ActiveQuery.css | git hash-object --stdin)" = "c03546ecd1a41d26cbbfa8f1e31d38731f77cf62"
          test "$(git -C /tmp/aqcss show HEAD:ActiveQuery.min.css | git hash-object --stdin)" = "bdda032d530661c32d9a9351a4ae95219347f081"
          test "$(git -C /tmp/aqjs show HEAD:ActiveQuery.js | git hash-object --stdin)" = "b8ec9e5be8668d048eea3385cd9012dfddb69cf0"
          test "$(git -C /tmp/aqjs show HEAD:ActiveQuery.min.js | git hash-object --stdin)" = "594d778cd5fefe2caa039a7904343e385b77a50c"
      - name: Generate AQCSS AST catalog
        run: npm run catalog:aqcss -- vendor/ActiveQuery.css knowledgebase/aqcss/generated-ast-catalog.json
      - name: Generate AQJS AST catalog
        run: npm run catalog:aqjs -- vendor/ActiveQuery.js vendor/ActiveQuery.min.js knowledgebase/aqjs/generated-ast-catalog.json
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Run browser tests
        run: npm test

      - name: Upload generated AQCSS catalog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqcss-postcss-catalog
          path: |
            knowledgebase/aqcss/generated-ast-catalog.json
            knowledgebase/aqjs/generated-ast-catalog.json
          if-no-files-found: ignore
