name: Deploy ActiveQuery Labs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate required site files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            index.html
            assets/site.css
            assets/site.js
            docs/aqcss/index.html
            docs/aqjs/index.html
            docs/ecosystem/index.html
            examples/index.html
            components/index.html
            components/components.css
            components/components.js
            playground/index.html
            playground/playground.css
            playground/playground.js
            docs/RESEARCH-BASELINE.md
            skills/README.md
            agent-reference/activequery-index.json
            examples/aqcss-utility-tour/index.html
            examples/aqjs-dom-helper/index.html
            examples/operations-dashboard/index.html
            examples/responsive-dashboard/index.html
            examples/responsive-dashboard/dashboard.css
            examples/responsive-dashboard/dashboard.js
            rebuild/index.html
            rebuild/assets/portal.css
            rebuild/assets/portal.js
            rebuild/guides/aqcss.html
            rebuild/guides/aqjs.html
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done
          echo "Validated ${#required[@]} required files."
          node --check playground/playground.js
          node --check components/components.js
          node --check tools/aq-inspect.mjs
          node --check rebuild/assets/portal.js
          echo "JavaScript syntax checks passed."
      - name: Fetch and verify pinned upstream assets and license notices
        run: node tools/fetch-pinned-sources.mjs
      - name: Verify distributable framework sources are present
        shell: bash
        run: |
          set -euo pipefail
          for file in ActiveQuery.css ActiveQuery.js ActiveQuery.min.css ActiveQuery.min.js CSS-LICENSE.txt JS-LICENSE.txt; do
            test -s "rebuild/vendor/$file" || { echo "Missing distributable source/notice: $file"; exit 1; }
          done
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: rebuild
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4